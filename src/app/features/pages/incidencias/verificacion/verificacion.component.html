<app-toolbar (click)="closeDialog()" [titulo]="titulo"></app-toolbar>
<div style="padding-top: 20px">
  <form [formGroup]="verificacionForm" (ngSubmit)="guardar()">
    <div class="form-row">
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Fecha Inicio</mat-label>
        <input
          type="datetime-local"
          matInput
          placeholder="Fecha Inicio"
          formControlName="FechaInicio"
          [readonly]="readOnly"
        />
      </mat-form-field>
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Fecha Fin</mat-label>
        <input
          type="datetime-local"
          matInput
          placeholder="Fecha Fin"
          formControlName="FechaFin"
          [readonly]="readOnly"
        />
      </mat-form-field>
      <mat-form-field
        appearance="outline"
        style="width: 100% !important; height: 200px !important"
      >
        <mat-label>Verificación</mat-label>
        <textarea
          class="mayus_textarea"
          matInput
          formControlName="Descripcion"
          placeholder="Verificación"
          style="resize: none !important"
        ></textarea>
      </mat-form-field>
    </div>

    <div class="form-row">
      <div
        style="
          padding-top: 10px;
          display: flex;
          justify-content: center;
          align-items: center;
          width: 100%;
        "
      >
        <button
          mat-raised-button
          color="primary"
          style="border-radius: 0px; background: #000580; width: 150px"
          type="submit"
        >
          <mat-icon>save</mat-icon><span class="u-color-white">Guardar</span>
        </button>
      </div>
    </div>
  </form>
</div>
