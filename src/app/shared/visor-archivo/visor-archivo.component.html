<app-toolbar (close)="closeDialog()" [titulo]="titulo"></app-toolbar>

<mat-dialog-content>
  <!-- Imagen -->
  @if (data.Tipo.startsWith("image/")) {
    <img
      [src]="data.Url"
      style="width: 100%; max-height: 70vh; object-fit: contain"
    />
  }

  <!-- PDF -->
  @if (data.Tipo == "application/pdf") {
    <iframe [src]="safeUrl" width="100%" height="600px"> </iframe>
  }

  @if (data.Tipo == "audio/ogg") {
    <audio [src]="safeUrl" controls autoplay></audio>
  }
  <!-- Otros tipos -->
  @if (
    !data.Tipo.startsWith("image/") &&
    data.Tipo !== "application/pdf" &&
    data.Tipo !== "audio/ogg"
  ) {
    <p>No se puede previsualizar este tipo de archivo.</p>
  }
</mat-dialog-content>
