<app-toolbar (close)="closeDialog()" [titulo]="titulo"></app-toolbar>

<div mat-dialog-content>
  <p>{{ data?.message }}</p>
</div>

<div style="padding-right: 20px" mat-dialog-actions [align]="'end'">
  <button
    mat-raised-button
    color="primary"
    style="
      border-radius: 0px;
      height: 45px;
      border-color: #000580;
      background: #000580;
      cursor: pointer;
      width: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    "
    type="submit"
    [mat-dialog-close]="false"
  >
    <mat-icon class="u-color-white">undo </mat-icon>
    <span class="u-color-white"> {{ data?.cancel }}</span>
  </button>
  <button
    mat-raised-button
    color="primary"
    style="
      border-radius: 0px;
      border-color: #000580;
      cursor: pointer;
      height: 45px;
      background: #000580;
      width: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-left: 25px;
    "
    type="submit"
    [mat-dialog-close]="true"
  >
    <mat-icon class="u-color-white"> check </mat-icon>
    <span class="u-color-white">{{ data?.confirm }}</span>
  </button>
</div>
